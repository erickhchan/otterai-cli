[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otterai-cli"
version = "0.1.4"
description = "Unofficial Otter.ai CLI — list, search, download, and manage meeting transcripts. Built for developers, scripts, and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "otter.ai",
    "otter",
    "meeting",
    "transcript",
    "cli",
    "meeting-notes",
    "speech-to-text",
    "ai-agent",
    "automation",
    "meeting-transcription",
]
authors = [
    { name = "Eric Chan", email = "eric.kahei.chan@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Office/Business",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "keyring>=23.0",
    "requests",
    "requests_toolbelt",
]

[project.urls]
Homepage = "https://github.com/erickhchan/otterai-cli"
Repository = "https://github.com/erickhchan/otterai-cli"
Issues = "https://github.com/erickhchan/otterai-cli/issues"
Changelog = "https://github.com/erickhchan/otterai-cli/releases"
Documentation = "https://github.com/erickhchan/otterai-cli#readme"

[project.scripts]
otter = "otterai.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "responses", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/otterai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true

[tool.coverage.run]
source = ["src/otterai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
