[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otterai-cli"
version = "0.1.0"
description = "Unofficial Otter.ai CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Eric Chan", email = "eric.kahei.chan@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0",
    "keyring>=23.0",
    "requests",
    "requests_toolbelt",
]

[project.urls]
Homepage = "https://github.com/ericchan-su/otterai-cli"
Repository = "https://github.com/ericchan-su/otterai-cli"
Issues = "https://github.com/ericchan-su/otterai-cli/issues"

[project.scripts]
otter = "otterai.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "responses", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/otterai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true

[tool.coverage.run]
source = ["src/otterai"]

[tool.coverage.report]
fail_under = 80
show_missing = true
